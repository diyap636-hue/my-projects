<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CA Inter Prep Tracker 🌸 — Kawaii Exam Study Companion</title>
  <meta name="description" content="A cute, kawaii-themed study tracker for CA Intermediate students. Track paper syllabus progress, revisions, mock test scores, Pomodoro focus time, and live exam countdown." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Custom Kawaii Design System -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-root">
    <!-- Desktop Persistent Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div>
        <div class="sidebar-brand">
          <div class="brand-icon-wrap">🌸</div>
          <div class="brand-text">
            <span class="brand-title">CA Inter Prep</span>
            <span class="brand-subtitle">STUDY COMPANION ✨</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="#dashboard" class="nav-link active" data-route="dashboard" id="nav-dashboard">
            <span class="nav-icon">🏠</span>
            <span>Home & Countdown</span>
          </a>
          <a href="#syllabus" class="nav-link" data-route="syllabus" id="nav-syllabus">
            <span class="nav-icon">📚</span>
            <span>Syllabus Editor</span>
          </a>
          <a href="#mock-tests" class="nav-link" data-route="mock-tests" id="nav-mock-tests">
            <span class="nav-icon">📝</span>
            <span>Mock Tests Log</span>
          </a>
          <a href="#timer" class="nav-link" data-route="timer" id="nav-timer">
            <span class="nav-icon">⏱️</span>
            <span>Pomodoro Timer</span>
          </a>
          <a href="#settings" class="nav-link" data-route="settings" id="nav-settings">
            <span class="nav-icon">⚙️</span>
            <span>Settings & Backup</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-study-badge">
          <span class="study-badge-icon">💖</span>
          <div>
            <div class="study-badge-title">You've Got This!</div>
            <div class="study-badge-sub">One chapter at a time 🌸</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Top Navigation Header -->
    <header class="mobile-top-bar">
      <div class="sidebar-brand" style="border-bottom: none; padding: 0;">
        <div class="brand-icon-wrap" style="width: 36px; height: 36px; font-size: 18px;">🌸</div>
        <div class="brand-text">
          <span class="brand-title" style="font-size: 15px;">CA Inter Prep</span>
        </div>
      </div>
    </header>

    <!-- Main Viewport Container -->
    <main class="app-main" id="main-content">
      <!-- Dynamic Views (Dashboard, Syllabus, Mock Tests, Timer, Settings) render here -->
    </main>

    <!-- Mobile Persistent Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
      <a href="#dashboard" class="mobile-nav-item active nav-link" data-route="dashboard">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="#syllabus" class="mobile-nav-item nav-link" data-route="syllabus">
        <span class="nav-icon">📚</span>
        <span>Syllabus</span>
      </a>
      <a href="#mock-tests" class="mobile-nav-item nav-link" data-route="mock-tests">
        <span class="nav-icon">📝</span>
        <span>Mocks</span>
      </a>
      <a href="#timer" class="mobile-nav-item nav-link" data-route="timer">
        <span class="nav-icon">⏱️</span>
        <span>Timer</span>
      </a>
      <a href="#settings" class="mobile-nav-item nav-link" data-route="settings">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- Main JavaScript App Entry -->
  <script src="js/bundle.js"></script>
</body>
</html>
